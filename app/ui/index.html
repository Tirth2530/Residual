<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' http://127.0.0.1:* 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream: http://localhost:8000 http://127.0.0.1:8000; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Residual</title>
<style>
@font-face { font-family: "Atkinson"; src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Atkinson"; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Fraunces"; src: url(fonts/fraunces-latin-600-normal.woff2) format("woff2"); font-weight: 600; }

/* Evening room: dim enough for light-sensitive eyes, warm enough not to feel clinical.
   The one loud thing on screen is the focus light: it is what the person follows all day. */
:root {
  --night: #1c1a24;        /* room */
  --dusk: #25232f;         /* surfaces */
  --dusk-2: #2e2b39;       /* raised surfaces */
  --line: #3a3647;
  --paper: #f2ede4;        /* text */
  --muted: #b3adbd;
  --faint: #7f7a8b;
  --light: #f4b63f;        /* the focus light */
  --light-ink: #2a1d05;
  --sage: #8fc1a3;         /* control is fine */
  --violet: #b3a8f5;       /* Residual speaking */
  --rose: #ef6d6d;         /* help */
  --rose-deep: #4a1f25;
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --scan: 1.6s;
  font-size: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); font-family: "Atkinson", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
body { display: grid; grid-template-rows: 76px 1fr 104px; }
svg.i { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------------------------ top strip */
#top { display: flex; align-items: center; gap: 22px; padding: 0 28px 0 96px; -webkit-app-region: drag; }
#top > * { -webkit-app-region: no-drag; white-space: nowrap; flex: none; }
.brand { font-family: "Fraunces", serif; font-weight: 600; font-size: 1.45rem; letter-spacing: .01em; color: var(--paper); }
.brand i { font-style: normal; color: var(--light); }
#when { color: var(--muted); font-size: 1.05rem; }
#when b { color: var(--paper); font-weight: 700; margin-left: 8px; }
#wx { color: var(--muted); font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
#appname { flex: 0 1 auto !important; min-width: 0; font-size: 1.05rem; color: var(--paper); padding: 8px 16px; border-radius: 999px; background: var(--dusk); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#appname[hidden] { display: none; }
.spacer { flex: 1 1 0 !important; }
#top.chip #wx { display: none; }
#pill { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px; background: var(--dusk); font-size: 1rem; color: var(--paper); transition: background .3s; }
#pill i { width: 11px; height: 11px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 4px rgba(143,193,163,.18); }
#pill.warn i { background: var(--light); box-shadow: 0 0 0 4px rgba(244,182,63,.2); }
#pill.off i { background: var(--faint); box-shadow: none; }
#pill.busy i { animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.6); opacity: .6; } }
#help { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; border: 0; background: var(--rose-deep); color: #ffd9d9; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
#help svg { width: 22px; height: 22px; }
#help.calling { background: var(--rose); color: #2b0b0f; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(239,109,109,.25); } }
#labBtn { border: 0; background: none; color: var(--faint); cursor: pointer; padding: 6px; border-radius: 10px; }
#labBtn:hover { color: var(--paper); background: var(--dusk); }
#labBtn svg { width: 22px; height: 22px; }

/* ------------------------------------------------------------------ stage */
#stage { position: relative; margin: 0 24px; border-radius: var(--r-lg); overflow: hidden; }
.screen { position: absolute; inset: 0; padding: 26px 34px 24px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
.f { cursor: pointer; border: 0; text-align: left; position: relative; transition: background .15s, color .15s, transform .15s; }
/* the focus light */
.f.on { background: var(--light) !important; color: var(--light-ink) !important; transform: scale(1.015); box-shadow: 0 0 0 6px rgba(244,182,63,.22), 0 18px 50px -18px rgba(244,182,63,.55); z-index: 2; }
.f.on small, .f.on .sub, .f.on .src { color: rgba(42,29,5,.72) !important; }
.f.on svg.i { stroke: var(--light-ink); }
.grp.gon { outline: 3px dashed rgba(244,182,63,.7); outline-offset: 8px; border-radius: var(--r-md); }
#help.on { background: var(--light); color: var(--light-ink); box-shadow: 0 0 0 6px rgba(244,182,63,.25); }

/* home */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }
.hello h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 3.1rem; line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.voice { display: flex; gap: 16px; align-items: flex-start; max-width: 64ch; margin-top: 12px; }
.voice p { margin: 0; font-size: 1.3rem; line-height: 1.45; color: var(--muted); }
.voice.speaking p { color: var(--paper); }
.wave { display: flex; gap: 3px; align-items: center; height: 26px; margin-top: 4px; flex: none; }
.wave b { width: 4px; height: 6px; border-radius: 2px; background: var(--violet); opacity: .5; }
.voice.speaking .wave b { opacity: 1; animation: wv .9s ease-in-out infinite; }
.voice.speaking .wave b:nth-child(2) { animation-delay: .12s } .voice.speaking .wave b:nth-child(3) { animation-delay: .24s }
.voice.speaking .wave b:nth-child(4) { animation-delay: .36s } .voice.speaking .wave b:nth-child(5) { animation-delay: .48s }
@keyframes wv { 50% { height: 24px; } }
.label { font-size: 1rem; color: var(--faint); margin: 0 0 12px 4px; }
.now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.sug { background: var(--dusk-2); border-radius: var(--r-md); padding: 22px 24px; min-height: 118px; display: flex; gap: 18px; align-items: center; }
.sug b { display: block; font-size: 1.35rem; line-height: 1.2; }
.sug small { display: block; color: var(--muted); font-size: .95rem; margin-top: 6px; }
.sug .ic { width: 56px; height: 56px; border-radius: 16px; background: rgba(179,168,245,.14); color: var(--violet); display: grid; place-items: center; flex: none; }
.f.on .ic { background: rgba(42,29,5,.12); color: var(--light-ink); }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px; min-height: 0; }
.tile { background: var(--dusk); border-radius: var(--r-md); padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; }
.tile svg.i { width: 40px; height: 40px; stroke-width: 1.6; color: var(--muted); }
.tile b { font-size: 1.6rem; display: block; }
.tile small { color: var(--muted); font-size: 1rem; display: block; margin-top: 4px; }
.tile.help { background: var(--rose-deep); color: #ffdcdc; }
.tile.help svg.i { color: var(--rose); }
.card.helpc { background: var(--rose-deep); color: #ffdcdc; } .card.helpc svg.i { color: var(--rose); }
.tile .count { position: absolute; top: 18px; right: 20px; background: var(--sage); color: #0f2318; font-weight: 700; border-radius: 999px; padding: 2px 11px; font-size: .95rem; }

/* inner screens */
.head { display: flex; align-items: center; gap: 18px; }
.head h2 { font-family: "Fraunces", serif; font-weight: 500; font-size: 2.3rem; margin: 0; }
.head p { margin: 0; color: var(--muted); font-size: 1.1rem; }
.backbtn { background: var(--dusk); border-radius: 999px; padding: 12px 22px 12px 16px; display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, 1fr); } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
.card { background: var(--dusk); border-radius: var(--r-md); padding: 22px 24px; display: flex; gap: 18px; align-items: center; min-height: 100px; }
.card b { display: block; font-size: 1.35rem; line-height: 1.25; }
.card small { display: block; color: var(--muted); font-size: 1rem; margin-top: 5px; line-height: 1.35; }
.card .ic { color: var(--muted); }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: "Fraunces", serif; font-size: 1.7rem; background: #3b3550; color: var(--paper); flex: none; }
.f.on .avatar { background: rgba(42,29,5,.15); color: var(--light-ink); }
.fill { flex: 1; min-height: 0; }
.phr { background: var(--dusk-2); border-radius: var(--r-md); padding: 24px; font-size: 1.45rem; line-height: 1.3; min-height: 110px; display: flex; align-items: center; }

/* say: the needs board */
.needs { display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 1fr; gap: 14px; flex: 1; min-height: 0; }
.need { grid-column: span 2; background: var(--dusk); border-radius: var(--r-md); font-size: 1.5rem; font-weight: 700; display: grid; place-items: center; text-align: center; padding: 12px; }
.need.big { grid-column: span 5; font-size: 2.6rem; font-family: "Fraunces", serif; font-weight: 600; background: var(--dusk-2); }
.need.care { box-shadow: inset 0 0 0 2px rgba(239,109,109,.35); }
.need.typ { grid-column: 1 / -1; font-size: 1.2rem; color: var(--muted); font-weight: 400; display: flex; justify-content: center; align-items: center; gap: 12px; }
.said { margin-left: auto; background: var(--violet); color: #1a1530; font-size: 1.5rem; font-weight: 700; padding: 14px 28px; border-radius: 999px; }

/* news */
.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tab { background: var(--dusk); border-radius: 999px; padding: 11px 20px; font-size: 1.05rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.tab svg.i { width: 20px; height: 20px; }
.tab.cur { background: var(--dusk-2); color: var(--paper); box-shadow: inset 0 0 0 2px var(--line); }
.stories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; flex: 1; min-height: 0; overflow: hidden; align-content: start; }
.story { background: var(--dusk); border-radius: var(--r-md); padding: 20px 22px; display: flex; gap: 16px; align-items: flex-start; min-height: 120px; }
.story img { width: 120px; height: 80px; object-fit: cover; border-radius: 12px; flex: none; background: var(--dusk-2); }
.story b { font-size: 1.22rem; line-height: 1.3; display: block; }
.story .src { color: var(--faint); font-size: .92rem; margin-top: 8px; display: block; }
.read { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; flex: 1; min-height: 0; }
.read article { background: var(--dusk); border-radius: var(--r-lg); padding: 32px 36px; overflow: auto; }
.read h3 { font-family: "Fraunces", serif; font-weight: 500; font-size: 2rem; line-height: 1.2; margin: 0 0 10px; }
.read .src { color: var(--faint); }
.read .body { font-size: 1.35rem; line-height: 1.6; color: var(--paper); margin-top: 22px; max-width: 60ch; }
.read .body.wait { color: var(--faint); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.opt { background: var(--dusk); border-radius: var(--r-md); padding: 20px 22px; font-size: 1.25rem; display: flex; align-items: center; gap: 14px; }

/* ask */
.ask { display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; flex: 1; min-height: 0; }
.convo { background: var(--dusk); border-radius: var(--r-lg); padding: 28px 30px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; }
.msg { max-width: 88%; font-size: 1.3rem; line-height: 1.5; padding: 16px 20px; border-radius: 22px; }
.msg.r { background: rgba(179,168,245,.13); color: var(--paper); border-bottom-left-radius: 6px; }
.msg.p { align-self: flex-end; background: var(--dusk-2); border-bottom-right-radius: 6px; }
.msg.think { color: var(--violet); }
.msg .by { display: block; font-size: .85rem; color: var(--faint); margin-bottom: 4px; }

/* app opening */
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 1.4rem; background: var(--dusk); border-radius: var(--r-lg); }

/* ------------------------------------------------------------------ control strip */
#controls { display: grid; grid-template-columns: 1fr 1.15fr 1fr auto; gap: 14px; padding: 14px 24px 18px; align-items: stretch; }
.role { background: var(--dusk); border-radius: var(--r-md); padding: 12px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; border: 0; text-align: left; position: relative; overflow: hidden; }
.role .what { font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.role .what svg { width: 22px; height: 22px; }
.role .how { font-size: 1.05rem; color: var(--muted); margin-top: 2px; transition: opacity .4s, transform .4s; }
.role.sel { background: var(--dusk-2); }
.role.dim .how { color: var(--faint); }
.role.flash { background: var(--light); color: var(--light-ink); }
.role.flash .how { color: rgba(42,29,5,.7); }
.role.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.role.changed .how { animation: swapin .9s ease; }
@keyframes swapin { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: none; } }
#mode { align-self: center; padding: 0 6px 0 12px; color: var(--faint); font-size: .95rem; max-width: 220px; line-height: 1.35; }
#mode b { color: var(--muted); display: block; font-size: 1.02rem; }

/* ------------------------------------------------------------------ overlays */
#overlay { position: fixed; inset: 76px 0 104px 0; display: none; place-items: center; background: rgba(20,18,26,.82); backdrop-filter: blur(8px); z-index: 50; }
#overlay.show { display: grid; }
.sheet { background: var(--dusk); border-radius: 32px; padding: 40px 46px; width: min(860px, 88vw); box-shadow: 0 40px 120px -30px rgba(0,0,0,.7); }
.sheet.wide { width: min(1100px, 92vw); }
.sheet h2 { font-family: "Fraunces", serif; font-weight: 500; font-size: 2.3rem; line-height: 1.15; margin: 0 0 12px; }
.sheet p { font-size: 1.3rem; line-height: 1.5; color: var(--muted); margin: 0 0 8px; }
.sheet .kicker { font-size: 1.05rem; color: var(--faint); margin-bottom: 14px; }
.choices { display: grid; gap: 14px; margin-top: 26px; }
.choices.two { grid-template-columns: repeat(2, 1fr); } .choices.three { grid-template-columns: repeat(3, 1fr); }
.btn { background: var(--dusk-2); border-radius: var(--r-md); padding: 20px 24px; font-size: 1.3rem; font-weight: 700; }
.btn.danger { background: var(--rose-deep); color: #ffd9d9; }
.big-n { font-family: "Fraunces", serif; font-size: 6rem; line-height: 1; margin: 18px 0 6px; color: var(--paper); }

/* migration: the moment Residual exists for */
.migr { display: flex; align-items: center; gap: 26px; margin: 26px 0 10px; }
.mv { padding: 22px 28px; border-radius: var(--r-md); background: var(--dusk-2); font-size: 1.55rem; font-weight: 700; display: flex; align-items: center; gap: 14px; transition: opacity .8s, filter .8s; }
.mv.old { opacity: .45; filter: saturate(.3); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: rgba(242,237,228,.4); }
.mv.new { background: rgba(143,193,163,.16); color: #d6f0e0; box-shadow: inset 0 0 0 2px rgba(143,193,163,.45); }
.mv.new.ok { background: var(--sage); color: #0f2318; }
.arrow { flex: 1; height: 3px; background: linear-gradient(90deg, rgba(242,237,228,.15), rgba(143,193,163,.9)); border-radius: 2px; position: relative; min-width: 80px; }
.arrow::after { content: ""; position: absolute; right: -2px; top: -7px; border: 8px solid transparent; border-left: 12px solid rgba(143,193,163,.9); border-right: 0; }
.dots { display: flex; gap: 14px; margin-top: 22px; }
.dots i { width: 26px; height: 26px; border-radius: 50%; background: var(--dusk-2); box-shadow: inset 0 0 0 2px var(--line); transition: background .3s; }
.dots i.got { background: var(--sage); box-shadow: none; }
.steps { display: flex; gap: 8px; margin-bottom: 18px; }
.steps i { height: 6px; flex: 1; border-radius: 3px; background: var(--dusk-2); }
.steps i.done { background: var(--sage); } .steps i.cur { background: var(--light); }

/* banner (non-blocking) */
#banner { position: fixed; left: 50%; top: 92px; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; z-index: 40; background: var(--dusk-2); border-radius: 22px; padding: 18px 26px; display: flex; gap: 16px; align-items: center; max-width: 820px; font-size: 1.2rem; line-height: 1.4; box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); transition: opacity .35s, transform .35s; }
#banner.show { opacity: 1; transform: translate(-50%, 0); }
#banner svg { color: var(--violet); }

/* lifeline */
.sheet.lifeline { background: #2a161b; }
.sheet.lifeline.ok { background: #16271e; }
.who-row { display: flex; gap: 12px; margin: 22px 0 8px; flex-wrap: wrap; }
.who { padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 1.15rem; color: var(--muted); }
.who.reached { background: rgba(239,109,109,.22); color: #ffd6d6; }
.who.acked { background: var(--sage); color: #0f2318; font-weight: 700; }
.calres { list-style: none; padding: 0; margin: 18px 0 6px; display: grid; gap: 10px; font-size: 1.25rem; }
.calres li { padding: 12px 18px; border-radius: 14px; background: rgba(255,255,255,.05); }
.calres li.ok { color: #d7f5e3; }
.calres li.bad { color: #ffd6d6; background: rgba(239,109,109,.14); }
.calres small { display: block; font-size: .95rem; color: var(--muted); margin-top: 4px; }

/* the care circle: who was asked, who was left alone, and why */
.circle { margin: 18px 0 4px; text-align: left; }
.circle .kicker { margin: 0 0 8px; }
.cr { display: grid; grid-template-columns: auto auto 1fr; gap: 6px 14px; align-items: baseline; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.05); margin: 6px 0; font-size: 1.1rem; }
.cr b { font-size: 1.2rem; }
.cr .tag { font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); }
.cr.first { background: rgba(120,200,150,.16); }
.cr.first .tag { background: var(--sage); color: #0f2318; font-weight: 700; }
.cr.alone .tag { background: rgba(244,182,63,.18); color: #f4d28a; }
.cr .why { color: var(--muted); }
.cr .via { grid-column: 1 / -1; font-size: .85rem; color: var(--faint); font-style: normal; }
.llog { list-style: none; padding: 0; margin: 14px 0 0; color: var(--faint); font-size: 1rem; line-height: 1.7; }

/* keyboard */
.kb .kbtext { font-size: 1.9rem; min-height: 64px; padding: 16px 20px; border-radius: var(--r-sm); background: var(--night); margin: 6px 0 18px; line-height: 1.3; }
.kb .ph { color: var(--faint); font-size: 1.3rem; }
.kb .caret { display: inline-block; width: 3px; height: 1.6rem; background: var(--light); vertical-align: middle; margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kbrows { display: flex; flex-direction: column; gap: 9px; }
.kbrow { display: flex; gap: 8px; padding: 5px; border-radius: 16px; }
.kbrow.on { background: var(--light); }
.kbrow.open { box-shadow: inset 0 0 0 2px var(--light); }
.key { flex: 1; text-align: center; padding: 13px 6px; font-size: 1.35rem; font-weight: 700; background: var(--dusk-2); border-radius: 12px; }
.kbrow.on .key { background: rgba(42,29,5,.12); color: var(--light-ink); }
.key.on { background: var(--light) !important; color: var(--light-ink); }
.key.pred { font-weight: 400; font-size: 1.15rem; flex: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kbwrap { display: block; }
.sheet.kb { padding: 24px 32px; max-height: calc(100% - 16px); overflow: auto; }
.sheet.kb .key { padding: 10px 6px; }
.sheet.kb .kbrows { gap: 6px; }
.sheet.kb .kbtext { margin: 4px 0 12px; min-height: 56px; padding: 12px 18px; }
.kbhelp { font-size: 1rem !important; margin-top: 14px !important; color: var(--faint) !important; }

/* presenter drawer for running without the engine (` key) */
#dev { position: fixed; right: 24px; bottom: 120px; width: 330px; background: var(--dusk-2); border-radius: 20px; padding: 18px; z-index: 60; font-size: .95rem; box-shadow: 0 30px 80px -20px #000; }
#dev[hidden] { display: none; }
#dev h4 { margin: 0 0 10px; font-size: 1rem; }

  <button id="help"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Get help</span></button>
  <button id="labBtn" title="Open the Lab (Cmd/Ctrl+L)"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
</header>
<main id="stage"></main>
<footer id="controls">
  <button class="role" id="r-back"><div><div class="what"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Back</div><div class="how">Look left</div></div></button>
  <button class="role sel" id="r-select"><div><div class="what"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg>Select</div><div class="how">Hand pinch</div></div></button>
  <button class="role" id="r-next"><div><div class="what">Next<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div><div class="how">Look right</div></div></button>
  <div id="mode"><b>Direct control</b><span>Three movements</span></div>
</footer>
<div id="overlay"></div>
<div id="banner"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/></svg><span></span></div>
<div id="dev" hidden>
  <h4>Without the engine</h4>
  <label>Hand <input type="range" id="d-hand" min="0" max="100" value="96"><span>96</span></label>
  <label>Eyebrow <input type="range" id="d-brow" min="0" max="100" value="91"><span>91</span></label>
  <label>Blink <input type="range" id="d-blink" min="0" max="100" value="88"><span>88</span></label>
  <button id="d-weak">Hand weakens</button><button id="d-one">Down to one</button><button id="d-eyes">Eyes on</button><button id="d-tired">Eyes tire</button><button id="d-reset">Reset</button><button id="d-ack">Carer answers</button>
  <p>These simulate the scores when the Python engine isn't running. With the engine on, use the Lab's scenario buttons instead: they degrade the real signal.</p>
